name: Copilot issue readiness check

# Checks every PalaeOpen template issue and, once it is complete, assigns it
# to the GitHub Copilot coding agent, which then opens a draft PR.
#
# 1. Readiness (GITHUB_TOKEN): runs .github/scripts/issue-readiness-check.js,
#    sets `🤖 ready-for-copilot` or `❓ status:needs-info`, and keeps one status
#    comment up to date so the submitter knows what is missing.
# 2. Assign (COPILOT_TRIGGER_PAT): assigns Copilot when the issue is ready.
#    This is done here, not by a separate `labeled` workflow, because label
#    changes made with GITHUB_TOKEN never trigger other workflows.
# 3. Report failure: comments on the issue if the assignment fails
#    (for example an expired COPILOT_TRIGGER_PAT).
#
# Issues that do not use a template are left alone. `⏸️ no-agent` opts an
# issue out. Maintainers can start Copilot by hand with the
# "Assign issue to Copilot (manual)" workflow (copilot-assign.yml).

on:
  issues:
    types: [opened, edited, reopened, labeled, unlabeled]

permissions:
  contents: read
  issues: write

jobs:
  readiness-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: copilot-readiness-${{ github.event.issue.number }}
      cancel-in-progress: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Evaluate issue readiness
        id: readiness
        uses: actions/github-script@v9
        with:
          script: |
            const run = require('./.github/scripts/issue-readiness-check.js');
            const result = await run({ github, context, core });
            const assign = result.ready && !result.optedOut && !result.closed;
            core.setOutput('assign', String(assign));

      - name: Assign issue to Copilot coding agent
        id: assign
        if: steps.readiness.outputs.assign == 'true'
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.COPILOT_TRIGGER_PAT }}
          script: |
            const assignCopilot = require('./.github/scripts/assign-copilot.js');
            await assignCopilot({
              github,
              context,
              core,
              issueNumber: context.payload.issue.number,
            });

      - name: Report assignment failure
        if: failure() && steps.assign.outcome == 'failure'
        uses: actions/github-script@v9
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body: [
                '⚠️ This request is complete, but the website assistant could not be started automatically.',
                '',
                `@OndrejMottl @xbenitogranell please check the [workflow run](${runUrl}). A common cause is an expired \`COPILOT_TRIGGER_PAT\` secret. After fixing it, start Copilot with the "Assign issue to Copilot (manual)" workflow.`,
              ].join('\n'),
            });
